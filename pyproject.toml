[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-sentiment-analysis"
version = "0.1.0"
description = "Financial text sentiment analysis dashboard using FinBERT and LIME"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "plotly>=5.15.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "lime>=0.2.0.1",
    "google-genai>=0.1.0",
    "tqdm>=4.66.0",
    "datasets>=2.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
